# Runs on every push to main and every pull request.
# Note the folder: .github/workflows (plural). The reference used "workflow", so it never ran.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # Postgres with pgvector, for the second test run (production's database engine).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18  # Postgres 18 = Neon; pinned so CI is reproducible
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # a throwaway CI container, not a real secret
          POSTGRES_DB: quorix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # torch first, CPU-only (~200 MB instead of ~2 GB with CUDA). sentence-transformers
        # then finds torch already installed and doesn't pull the CUDA build.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests (SQLite)
        # No real secrets needed: tests/conftest.py sets a test secret and an in-memory database.
        run: pytest -q

      - name: Run tests (Postgres + pgvector)
        # The same suite on production's engine: real `<=>` vector search, real migrations.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/quorix_test
          TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (exactly what the lockfile says)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        # Test-only secrets come from src/test/setup.ts; no real secrets in CI.
        run: pnpm test

      - name: Production build
        run: pnpm build
