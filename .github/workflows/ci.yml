# Runs on every push to main and every pull request.
# Note the folder: .github/workflows (plural). The reference used "workflow", so it never ran.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # Postgres with pgvector, for the second test run (production's database engine).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18  # Postgres 18 = Neon; pinned so CI is reproducible
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # a throwaway CI container, not a real secret
          POSTGRES_DB: quorix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # torch first, CPU-only (~200 MB instead of ~2 GB with CUDA). sentence-transformers
        # then finds torch already installed and doesn't pull the CUDA build.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests (SQLite)
        # No real secrets needed: tests/conftest.py sets a test secret and an in-memory database.
        run: pytest -q

      - name: Run tests (Postgres + pgvector)
        # The same suite on production's engine: real `<=>` vector search, real migrations.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/quorix_test
          TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (exactly what the lockfile says)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        # Test-only secrets come from src/test/setup.ts; no real secrets in CI.
        run: pnpm test

      - name: Production build
        run: pnpm build

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Throwaway secrets for this run (never real ones)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "BACKEND_JWT_SECRET=$(openssl rand -hex 32)"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build the images and start the stack (waits for every health check)
        run: docker compose up --build --detach --wait --wait-timeout 420

      - name: Smoke test
        run: |
          # The web app answers on the only published port.
          curl --fail --silent --show-error http://localhost:3000/login > /dev/null
          # The API isn't published: check it from inside its own container.
          docker compose exec -T backend python -c "import urllib.request, json; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health')))"
          # Migrations ran at startup: the vector column exists in Postgres.
          docker compose exec -T postgres psql -U quorix -d quorix -tAc "select format_type(atttypid, atttypmod) from pg_attribute where attrelid = 'chunks'::regclass and attname = 'embedding'" | grep -q "vector(384)"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep quorix

      # End-to-end tests in a real browser against the production stack that's now running.
      # Playwright's config finds the app on :3000 and reuses it instead of starting a dev server.
      - name: Set up pnpm (for the end-to-end tests)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: End-to-end tests (Playwright, Chromium)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
