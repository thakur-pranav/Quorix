# Continuous deployment of the API to a Hugging Face Space (Docker), after CI passes on main.
#
# The Space is a deploy target, not the source of truth: each run pushes a fresh snapshot of
# backend/ (plus the Space's config header) and the Space rebuilds the image from its Dockerfile.
# Needs, in the GitHub repo settings: secret HF_TOKEN (write access) and variable HF_SPACE
# (e.g. "user/quorix-api"). Without them, the job skips itself.
name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never cut a deploy off half-way

jobs:
  deploy:
    name: Push backend/ to the Space
    # Only after a green CI run (or a manual trigger), and only once configured.
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build the Space's contents
        run: |
          mkdir space
          # Only what the image needs; .dockerignore keeps the rest out of the build anyway.
          rsync -a --exclude tests --exclude '.env*' --exclude data --exclude '__pycache__' backend/ space/
          cat > space/README.md <<'MD'
          ---
          title: Quorix API
          emoji: 🔎
          colorFrom: purple
          colorTo: indigo
          sdk: docker
          app_port: 8000
          pinned: false
          short_description: Multi-tenant RAG support assistant with analytics (API)
          ---

          The FastAPI backend of Quorix. Deployed from GitHub by CI; don't edit here.
          MD
          sed -i 's/^          //' space/README.md

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "quorix-deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          # The token goes in the URL for this one push only; it's masked in the logs.
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
